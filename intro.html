<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./src/assets/6744ffba83bf874c1073eb88_favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IKEA INDIA</title>
  <script type="module" crossorigin src="/assets/index-C1PgIqe4.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DqiT-Fnq.css">
</head>

<body>
  <div id="root"></div>
  <script>
    // Wire up "Explore All" button -> /secondhand.html
    (function () {
      function patchExploreButton() {
        var buttons = document.querySelectorAll('button');
        buttons.forEach(function (btn) {
          if (btn.textContent.trim() === 'Explore All' && !btn.dataset.patched) {
            btn.dataset.patched = '1';
            btn.addEventListener('click', function () {
              window.location.href = '/secondhand.html';
            });
          }
        });
      }

      // Wire up "Explore IKEA" anchor -> /marketplace
      function patchExploreIkeaLink() {
        var links = document.querySelectorAll('.hero-button a');
        links.forEach(function (link) {
          if (link.textContent.trim() === 'Explore IKEA' && !link.dataset.patched) {
            link.dataset.patched = '1';
            link.href = 'http://localhost:8080/secondhand.html';
          }
        });
      }

      // Run after React mounts
      var observer = new MutationObserver(function () {
        patchExploreButton();
        patchExploreIkeaLink();
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });

      // Also try immediately after DOM ready
      document.addEventListener('DOMContentLoaded', function () {
        patchExploreButton();
        patchExploreIkeaLink();
      });
    })();
  </script>
</body>

</html>
